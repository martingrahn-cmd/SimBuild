<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Dollarton</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23203050%27/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0d14; font-family: "Segoe UI", Inter, system-ui, sans-serif; color: #e8ecf2; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 35%, #203147 0%, #0d1521 48%, #070a10 100%); z-index: 100; transition: opacity .6s; }
    #boot .card { width: min(520px, calc(100vw - 56px)); padding: 34px 38px 30px; border: 1px solid rgba(160,190,220,.18); border-radius: 8px; background: rgba(10,16,25,.78); box-shadow: 0 24px 80px rgba(0,0,0,.4); }
    #boot .eyebrow { color: #7cc3ff; font-size: 11px; letter-spacing: .22em; margin-bottom: 11px; }
    #boot .title { font-size: 40px; letter-spacing: .24em; font-weight: 300; }
    #boot .sub { font-size: 12px; opacity: .72; margin-top: 10px; letter-spacing: .14em; }
    #boot .progress { height: 7px; margin-top: 30px; overflow: hidden; border-radius: 6px; background: #1b2634; border: 1px solid rgba(160,190,220,.12); }
    #boot .progress i { display: block; width: 2%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #318ee8, #73c9ff); transition: width .25s ease; }
    #boot .meta { display: flex; justify-content: space-between; gap: 20px; margin-top: 10px; font-size: 12px; color: #9caaba; }
    #boot .tip { margin-top: 25px; padding-top: 18px; border-top: 1px solid rgba(160,190,220,.12); color: #77879a; font-size: 12px; line-height: 1.45; }
    #boot.hidden { opacity: 0; pointer-events: none; }
    #errbanner { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(160,30,30,.85); color: #fff; font-size: 12px; padding: 6px 10px; display: none; z-index: 200; white-space: pre-wrap; max-height: 30vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="app"><canvas id="c"></canvas></div>
  <div id="ui"></div>
  <div id="boot"><div class="card"><div class="eyebrow">CITY BUILDER</div><div class="title">NEW DOLLARTON</div><div class="sub">BUILD YOUR CITY</div><div class="progress" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="2"><i id="bootbar"></i></div><div class="meta"><span id="bootmsg">STARTING ENGINE</span><span id="bootpct">2%</span></div><div class="tip">You can start building as soon as preparation finishes. Roads create roadside cells; paint zoning on those cells and buildings grow with demand.</div></div></div>
  <div id="errbanner"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
